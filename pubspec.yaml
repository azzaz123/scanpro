name: scanpro
description: Escáner de documentos profesional
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  # ✅ Isar community (reemplazo del isar abandonado)
  isar_community: ^3.1.2
  isar_community_flutter_libs: ^3.1.2
  path_provider: ^2.1.4
  google_mlkit_document_scanner: ^0.2.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  image: ^4.2.0
  image_cropper: ^8.0.2
  photo_view: ^0.15.0
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.20.2
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1
  file_picker: ^8.1.7
  flutter_file_dialog: ^3.0.2
  shared_preferences: ^2.3.3          # ⬅️ NUEVO (onboarding)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.1.2
  flutter_launcher_icons: ^0.14.1     # ⬅️ AQUÍ (dev), no en dependencies
  flutter_native_splash: ^2.4.3       # ⬅️ NUEVO

flutter:
  uses-material-design: true
  assets:
    - assets/icon/    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf                  # ⬅️ NUEVO: icono

# ⬇️ CONFIGURACIÓN DEL ICONO
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1E6FFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# ⬇️ CONFIGURACIÓN DEL SPLASH
flutter_native_splash:
  color: "#1E6FFF"
  color_dark: "#0D47A1"
  image: "assets/icon/app_icon.png"
  android_12:
    color: "#1E6FFF"
    color_dark: "#0D47A1"
    image: "assets/icon/app_icon.png"
    icon_background_color: "#1E6FFF"